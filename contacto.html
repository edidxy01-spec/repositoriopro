<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Mi Página Gamer</title>
   
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

   
    <header>
        <div class="marca">
            <img src="assets/img/phone.jpg" alt="Logo" class="logo">
            <h1>Contacto Gamer</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="log.html">Log</a></li>
                <li><a href="info.html">Info</a></li>
            </ul>
        </nav>
    </header>

   
    <main style="display: block; max-width: 800px;">
        <div class="caja-info" style="width: 100%;">
            <h2 style="color: #00FF88; margin-bottom: 20px;">¡Ponte en contacto con el equipo!</h2>
            <p style="margin-bottom: 20px; font-size: 1.1rem;">¿Tienes alguna duda, propuesta o quieres unirte a las partidas? Escríbenos por aquí.</p>
            
            <!-- Un formulario simple con estilo gamer -->
            <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #00FF88;">Tu Nick / Nombre:</label>
                    <input type="text" placeholder="Ej. ProPlayer123" style="width: 100%; padding: 10px; background-color: #0B0E14; border: 1px solid #2A3441; color: #F0F4F8; border-radius: 6px;">
                </div>
                
                <div>
                    <label style="display: block; margin-bottom: 5px; color: #00FF88;">Correo electrónico:</label>
                    <input type="email" placeholder="correo@example.com" style="width: 100%; padding: 10px; background-color: #0B0E14; border: 1px solid #2A3441; color: #F0F4F8; border-radius: 6px;">
                </div>

                <div>
                    <label style="display: block; margin-bottom: 5px; color: #00FF88;">Mensaje:</label>
                    <textarea rows="4" placeholder="Escribe tu mensaje aquí..." style="width: 100%; padding: 10px; background-color: #0B0E14; border: 1px solid #2A3441; color: #F0F4F8; border-radius: 6px;"></textarea>
                </div>

                <button type="submit" style="background-color: #00FF88; color: #0B0E14; padding: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s;">
                    Enviar Mensaje
                </button>
            </form>
        </div>
    </main>

    <footer>
        <p>Hecho por mí</p>
    </footer>
    <img src="assets/img/phone.jpg" alt="logo" class="logo">

</body>
</html>
