<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log / Iniciar Sesión - Mi Página Gamer</title>
    
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

   
    <header>
        <div class="marca">
            <img src="assets/img/engranaje.jpg" alt="Logo" class="logo">
            <h1>Acceso Gamer</h1>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="contacto.html">Contacto</a></li>
                <li><a href="log.html">Log</a></li>
                <li><a href="info.html">Info</a></li>
            </ul>
        </nav>
    </header>

  
    <main style="display: block; max-width: 500px;">
        <div class="caja-info" style="width: 100%;">
            <h2 style="color: #00FF88; margin-bottom: 20px; text-align: center;">Iniciar Sesión</h2>
            <p style="margin-bottom: 25px; text-align: center; color: #8B9BB4; font-size: 0.95rem;">Entra con tu cuenta para unirte al clan.</p>
            
            <form action="#" method="POST" style="display: flex; flex-direction: column; gap: 20px;">
                <div>
                    <label style="display: block; margin-bottom: 8px; color: #00FF88;">Usuario o Correo:</label>
                    <input type="text" placeholder="Tu nick gamer" style="width: 100%; padding: 12px; background-color: #0B0E14; border: 1px solid #2A3441; color: #F0F4F8; border-radius: 6px;">
                </div>
                
                <div>
                    <label style="display: block; margin-bottom: 8px; color: #00FF88;">Contraseña:</label>
                    <input type="password" placeholder="••••••••" style="width: 100%; padding: 12px; background-color: #0B0E14; border: 1px solid #2A3441; color: #F0F4F8; border-radius: 6px;">
                </div>

                <button type="submit" style="background-color: #00FF88; color: #0B0E14; padding: 12px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; margin-top: 10px;">
                    Entrar al Juego
                </button>
            </form>
        </div>
    </main>

    <footer>
        <p>Hecho por mí</p>
    </footer>

</body>
</html>
